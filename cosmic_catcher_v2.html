
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #game-root {
    font-family: var(--font-sans);
    background: #0a0a1a;
    min-height: 540px;
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    position: relative;
    user-select: none;
  }
  #canvas { display: block; width: 100%; height: 540px; cursor: none; }
  #ui-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .screen-box {
    pointer-events: all;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: rgba(10,10,30,0.92);
    border: 0.5px solid rgba(150,130,255,0.35);
    border-radius: 18px;
    padding: 36px 48px;
  }
  .screen-title { font-size: 28px; font-weight: 500; color: #c8b8ff; letter-spacing: 1px; }
  .screen-sub { font-size: 14px; color: #8880aa; text-align: center; max-width: 260px; }
  .play-btn {
    margin-top: 8px; padding: 12px 36px;
    font-size: 16px; font-weight: 500;
    background: linear-gradient(135deg, #7c5cbf, #4e8ef7);
    color: #fff; border: none; border-radius: 50px; cursor: pointer;
    transition: transform 0.12s, opacity 0.12s; letter-spacing: 0.5px;
  }
  .play-btn:hover { transform: scale(1.05); opacity: 0.92; }
  .play-btn:active { transform: scale(0.97); }
  .outline-btn {
    padding: 10px 28px; font-size: 14px; font-weight: 500;
    background: transparent; color: #c8b8ff;
    border: 0.5px solid rgba(150,130,255,0.5); border-radius: 50px; cursor: pointer;
    transition: transform 0.12s, background 0.12s;
  }
  .outline-btn:hover { background: rgba(150,130,255,0.1); transform: scale(1.03); }
  #hud {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; pointer-events: none;
  }
  .hud-pill {
    background: rgba(255,255,255,0.07);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 5px 14px;
    font-size: 13px; font-weight: 500; color: #d0c8ff;
    display: flex; align-items: center; gap: 6px;
  }
  .hud-dot { width: 8px; height: 8px; border-radius: 50%; }
  #hud-controls { display: flex; gap: 8px; pointer-events: all; }
  .hud-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #d0c8ff; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, transform 0.1s;
  }
  .hud-btn:hover { background: rgba(255,255,255,0.16); transform: scale(1.08); }
  .hud-btn:active { transform: scale(0.94); }
  #combo-display {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: 500; color: #ffd060;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
  }
  #level-announce {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 36px; font-weight: 500; color: #fff;
    opacity: 0; pointer-events: none;
  }
  #final-score { font-size: 42px; font-weight: 500; color: #fff; }
  #final-label { font-size: 13px; color: #8880aa; letter-spacing: 1px; text-transform: uppercase; }
  #best-score { font-size: 14px; color: #7c9fff; }
  #pause-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5,5,20,0.75);
    display: none; align-items: center; justify-content: center;
  }
</style>

<div id="game-root">
  <canvas id="canvas"></canvas>

  <div id="hud" style="display:none">
    <div class="hud-pill"><div class="hud-dot" style="background:#7af0a0"></div><span id="score-display">0</span></div>
    <div class="hud-pill" style="color:#ffd060"><div class="hud-dot" style="background:#ffd060"></div>Lv <span id="level-display">1</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="hud-pill"><span id="lives-wrap"></span></div>
      <div id="hud-controls">
        <button class="hud-btn" id="pause-btn" title="Pause">&#9646;&#9646;</button>
        <button class="hud-btn" id="stop-btn" title="Stop" style="color:#ff8080">&#9632;</button>
      </div>
    </div>
  </div>

  <div id="combo-display"></div>
  <div id="level-announce"></div>

  <div id="pause-overlay">
    <div class="screen-box">
      <div class="screen-title">Paused</div>
      <div class="screen-sub">Take a breath. The cosmos will wait.</div>
      <button class="play-btn" id="resume-btn">Resume</button>
      <button class="outline-btn" id="stop-from-pause-btn">Quit game</button>
    </div>
  </div>

  <div id="ui-overlay">
    <div id="start-screen" class="screen-box">
      <div class="screen-title">Cosmic Catcher</div>
      <div class="screen-sub">Move your ship to catch gems. Dodge red meteors. Grab gold stars for powerups!</div>
      <button class="play-btn" id="start-btn">Play Now</button>
    </div>
    <div id="gameover-screen" class="screen-box" style="display:none">
      <div class="screen-title">Game Over</div>
      <div id="final-label">Your Score</div>
      <div id="final-score">0</div>
      <div id="best-score"></div>
      <button class="play-btn" id="restart-btn">Play Again</button>
    </div>
    <div id="quit-screen" class="screen-box" style="display:none">
      <div class="screen-title">Game Stopped</div>
      <div id="quit-score-label" style="font-size:13px;color:#8880aa;letter-spacing:1px;text-transform:uppercase">Your Score</div>
      <div id="quit-score" style="font-size:42px;font-weight:500;color:#fff">0</div>
      <div id="quit-best" style="font-size:14px;color:#7c9fff"></div>
      <button class="play-btn" id="quit-restart-btn">Play Again</button>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const quitScreen = document.getElementById('quit-screen');
  const pauseOverlay = document.getElementById('pause-overlay');
  const scoreDisplay = document.getElementById('score-display');
  const levelDisplay = document.getElementById('level-display');
  const livesWrap = document.getElementById('lives-wrap');
  const comboDisplay = document.getElementById('combo-display');
  const levelAnnounce = document.getElementById('level-announce');
  const finalScore = document.getElementById('final-score');
  const bestScoreEl = document.getElementById('best-score');

  let W, H, raf, gameState = 'idle';
  let ship, objects, particles, score, lives, level, combo, bestScore = 0;
  let spawnTimer = 0, levelUpCooldown = false;
  let comboFadeTimer = null;
  let paused = false;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = canvas.width = rect.width || 680;
    H = canvas.height = 540;
  }

  function initGame() {
    score = 0; lives = 3; level = 1; combo = 0;
    objects = []; particles = []; spawnTimer = 0; levelUpCooldown = false; paused = false;
    ship = { x: W/2, y: H-70, targetX: W/2, trail: [], shield: 0, magnet: 0 };
    scoreDisplay.textContent = '0'; levelDisplay.textContent = '1';
    updateLives();
    gameState = 'playing';
    hud.style.display = 'flex';
    pauseOverlay.style.display = 'none';
    document.getElementById('pause-btn').innerHTML = '&#9646;&#9646;';
  }

  function updateLives() {
    livesWrap.innerHTML = '';
    for (let i = 0; i < lives; i++) {
      const s = document.createElement('span');
      s.style.cssText = 'color:#ff6b8a;font-size:13px';
      s.textContent = '♥ ';
      livesWrap.appendChild(s);
    }
  }

  function spawnObject() {
    const pool = ['gem','gem','gem','meteor','meteor','powerup'];
    if (level >= 3) pool.push('meteor','gem');
    const type = pool[Math.floor(Math.random()*pool.length)];
    const gemColors = ['#7af0a0','#5bc8f5','#c378f5','#f5c842','#f57842'];
    objects.push({
      type, x: 30+Math.random()*(W-60), y: -30,
      vy: 1.5+Math.random()*1.5+level*0.3,
      vx: (Math.random()-0.5)*(level>=4?2.5:1.5),
      r: type==='meteor'?18+Math.random()*10:type==='gem'?12:14,
      rot: 0, rotv: (Math.random()-0.5)*0.08,
      color: type==='gem'?gemColors[Math.floor(Math.random()*gemColors.length)]:type==='meteor'?'#e84040':'#ffe840',
      value: type==='gem'?(10*level):0, pulse: 0
    });
  }

  function spawnParticles(x, y, color, count=10) {
    for (let i=0; i<count; i++) {
      const a=Math.random()*Math.PI*2, spd=1.5+Math.random()*3.5;
      particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,color,life:1,r:2+Math.random()*3});
    }
  }

  function showCombo(c) {
    comboDisplay.textContent = c>=5?`x${c} COMBO!`:`x${c} combo`;
    comboDisplay.style.opacity='1';
    comboDisplay.style.color=c>=10?'#ff9940':c>=5?'#ffd060':'#aaffcc';
    comboDisplay.style.fontSize=c>=10?'26px':c>=5?'22px':'18px';
    if(comboFadeTimer) clearTimeout(comboFadeTimer);
    comboFadeTimer=setTimeout(()=>{comboDisplay.style.opacity='0';},900);
  }

  function announceLevel(l) {
    levelAnnounce.textContent=`Level ${l}`;
    levelAnnounce.style.opacity='1';
    setTimeout(()=>{levelAnnounce.style.opacity='0';},1200);
  }

  function drawShip(x,y,shield,magnet) {
    ctx.save(); ctx.translate(x,y);
    const eg=ctx.createRadialGradient(0,18,2,0,18,22);
    eg.addColorStop(0,'rgba(90,160,255,0.6)'); eg.addColorStop(1,'rgba(90,160,255,0)');
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,20,22,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,-18);ctx.lineTo(16,14);ctx.lineTo(6,10);ctx.lineTo(0,14);ctx.lineTo(-6,10);ctx.lineTo(-16,14);ctx.closePath();
    const bg=ctx.createLinearGradient(0,-18,0,14);
    bg.addColorStop(0,'#c8b8ff'); bg.addColorStop(1,'#7c5cbf');
    ctx.fillStyle=bg; ctx.fill();
    ctx.strokeStyle='rgba(200,180,255,0.5)'; ctx.lineWidth=0.5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-4,6,9,0,0,Math.PI*2);
    ctx.fillStyle='rgba(160,220,255,0.5)'; ctx.fill();
    if(shield>0){
      ctx.beginPath(); ctx.arc(0,0,32,0,Math.PI*2);
      ctx.strokeStyle=`rgba(100,200,255,${Math.min(1,shield/5)*0.7})`;
      ctx.lineWidth=2.5; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
    }
    if(magnet>0){
      ctx.beginPath(); ctx.arc(0,0,42,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,220,80,${Math.min(1,magnet/5)*0.4})`;
      ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.restore();
  }

  function drawGem(x,y,r,color,rot,pulse) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    const s=1+Math.sin(pulse)*0.07; ctx.scale(s,s);
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2;i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
    ctx.closePath();
    const g=ctx.createRadialGradient(0,0,1,0,0,r);
    g.addColorStop(0,'#fff');g.addColorStop(0.3,color);g.addColorStop(1,color+'88');
    ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=0.5;ctx.stroke();ctx.restore();
  }

  function drawMeteor(x,y,r,rot) {
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2,rr=r*(0.75+(i%3===0?0.25:0));i===0?ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
    ctx.closePath();
    const g=ctx.createRadialGradient(0,0,1,0,0,r);
    g.addColorStop(0,'#ff9060');g.addColorStop(0.5,'#e84040');g.addColorStop(1,'#7a1010');
    ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#ff7050';ctx.lineWidth=0.5;ctx.stroke();ctx.restore();
  }

  function drawPowerup(x,y,r,rot,pulse) {
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    const s=1+Math.sin(pulse)*0.12;ctx.scale(s,s);
    ctx.beginPath();
    for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2-Math.PI/2,ai=a+Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(ai)*r*0.45,Math.sin(ai)*r*0.45);}
    ctx.closePath();ctx.fillStyle='#ffe840';ctx.fill();ctx.strokeStyle='#fff5a0';ctx.lineWidth=0.8;ctx.stroke();ctx.restore();
  }

  const stars=[];
  for(let i=0;i<90;i++) stars.push({x:Math.random(),y:Math.random(),r:0.4+Math.random()*1.2,a:0.3+Math.random()*0.7,phase:Math.random()*Math.PI*2});

  function drawStars() {
    const t=Date.now()/1000;
    for(const s of stars){ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a*(0.6+0.4*Math.sin(t+s.phase))})`;ctx.fill();}
  }

  let lastTime=0;
  function loop(ts) {
    raf=requestAnimationFrame(loop);
    if(gameState!=='playing'||paused) return;
    const dt=Math.min((ts-lastTime)/16.67,3);lastTime=ts;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
    drawStars();

    ship.x+=(ship.targetX-ship.x)*0.14;
    ship.trail.push({x:ship.x,y:ship.y});
    if(ship.trail.length>18)ship.trail.shift();
    for(let i=0;i<ship.trail.length;i++){const t=ship.trail[i];ctx.beginPath();ctx.arc(t.x,t.y+14,3*(i/ship.trail.length),0,Math.PI*2);ctx.fillStyle=`rgba(120,100,255,${(i/ship.trail.length)*0.25})`;ctx.fill();}

    if(ship.shield>0)ship.shield-=0.02*dt;
    if(ship.magnet>0)ship.magnet-=0.02*dt;
    drawShip(ship.x,ship.y,ship.shield,ship.magnet);

    spawnTimer+=dt;
    const spawnRate=Math.max(22,55-level*4);
    if(spawnTimer>=spawnRate/60*60){spawnObject();spawnTimer=0;}

    if(ship.magnet>0){
      for(const o of objects){
        if(o.type!=='meteor'){const d=Math.hypot(o.x-ship.x,o.y-ship.y);if(d<120){const a=Math.atan2(ship.y-o.y,ship.x-o.x);o.vx+=Math.cos(a)*0.4;o.vy+=Math.sin(a)*0.4;}}
      }
    }

    for(let i=objects.length-1;i>=0;i--){
      const o=objects[i];
      o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.rotv*dt;o.pulse=(o.pulse||0)+0.08*dt;
      if(o.x<o.r){o.x=o.r;o.vx*=-1;}if(o.x>W-o.r){o.x=W-o.r;o.vx*=-1;}
      if(o.type==='gem')drawGem(o.x,o.y,o.r,o.color,o.rot,o.pulse);
      else if(o.type==='meteor')drawMeteor(o.x,o.y,o.r,o.rot);
      else drawPowerup(o.x,o.y,o.r,o.rot,o.pulse);

      const d=Math.hypot(o.x-ship.x,o.y-ship.y);
      if(d<22+o.r-6){
        if(o.type==='gem'){combo++;const pts=o.value*(combo>=5?2:1);score+=pts;scoreDisplay.textContent=score;spawnParticles(o.x,o.y,o.color,12);if(combo>=2)showCombo(combo);}
        else if(o.type==='meteor'){if(ship.shield>0){ship.shield=0;spawnParticles(o.x,o.y,'#ff6040',18);}else{lives--;combo=0;spawnParticles(o.x,o.y,'#ff4040',20);updateLives();if(lives<=0){endGame();return;}}}
        else{ship.shield=Math.random()<0.5?8:0;ship.magnet=ship.shield?0:8;if(!ship.shield)ship.magnet=8;spawnParticles(o.x,o.y,'#ffd060',14);}
        objects.splice(i,1);continue;
      }
      if(o.y>H+40){if(o.type==='gem')combo=0;objects.splice(i,1);}
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.05*dt;p.life-=0.04*dt;
      if(p.life<=0){particles.splice(i,1);continue;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
      ctx.fillStyle=p.color+Math.floor(p.life*255).toString(16).padStart(2,'0');ctx.fill();
    }

    const nl=Math.floor(score/500)+1;
    if(nl>level&&!levelUpCooldown){level=nl;levelDisplay.textContent=level;announceLevel(level);levelUpCooldown=true;setTimeout(()=>{levelUpCooldown=false;},1500);}
  }

  function endGame() {
    gameState='gameover';hud.style.display='none';
    if(score>bestScore)bestScore=score;
    finalScore.textContent=score;bestScoreEl.textContent=`Best: ${bestScore}`;
    gameoverScreen.style.display='flex';
  }

  function stopGame() {
    gameState='stopped';hud.style.display='none';paused=false;
    pauseOverlay.style.display='none';
    if(score>bestScore)bestScore=score;
    document.getElementById('quit-score').textContent=score;
    document.getElementById('quit-best').textContent=`Best: ${bestScore}`;
    quitScreen.style.display='flex';
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);drawStars();
  }

  function togglePause() {
    if(gameState!=='playing')return;
    paused=!paused;
    pauseOverlay.style.display=paused?'flex':'none';
    document.getElementById('pause-btn').innerHTML=paused?'&#9654;':'&#9646;&#9646;';
    if(!paused)lastTime=performance.now();
  }

  canvas.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect();ship.targetX=(e.clientX-rect.left)*(W/rect.width);});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();ship.targetX=(e.touches[0].clientX-rect.left)*(W/rect.width);},{passive:false});

  document.getElementById('pause-btn').onclick=togglePause;
  document.getElementById('stop-btn').onclick=stopGame;
  document.getElementById('resume-btn').onclick=togglePause;
  document.getElementById('stop-from-pause-btn').onclick=stopGame;

  function startFresh() {
    startScreen.style.display='none';gameoverScreen.style.display='none';quitScreen.style.display='none';
    resize();initGame();
  }

  document.getElementById('start-btn').onclick=()=>{startScreen.style.display='none';resize();initGame();requestAnimationFrame(loop);};
  document.getElementById('restart-btn').onclick=()=>{gameoverScreen.style.display='none';resize();initGame();};
  document.getElementById('quit-restart-btn').onclick=()=>{quitScreen.style.display='none';resize();initGame();};

  resize();
  requestAnimationFrame(loop);
})();
</script>
